    description: "Tecnologia, inteligência artificial, big techs, startups, negócios e indústria."
    keywords: [inteligencia artificial, ia, openai, anthropic, google, apple, microsoft, meta platforms, zuckerberg, facebook, instagram, nvidia, amazon, tesla, startup, chip, semicondutor, software, data center, dados pessoais, ciberseguranca, tecnologia, app, varejo, industria, spacex, starship, starlink, foguete, satelite, nasa, espacial, rocket, satellite]
