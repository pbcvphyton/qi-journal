# Configuração geral do jornal (marca ativa: PBCV Tech).
# Fontes de notícia ficam em config/sources.yaml.
#
# Várias chaves podem ser sobrescritas por variáveis de ambiente
# (útil no GitHub Actions): QIJ_BRAND, QIJ_BASE_URL, QIJ_MODEL, QIJ_EFFORT,
# QIJ_NO_LLM=1, EMAIL_TO (lista separada por vírgulas).

site:
  base_url: "https://pbcvphyton.github.io/qi-journal/"
  repo_url: "https://github.com/pbcvphyton/qi-journal"
  timezone: "America/Sao_Paulo"
  archive_keep_days: 400        # edições (HTML + JSON) mais antigas são removidas

# Marca ativa: "tech" (PBCV Tech) ou "pbcv" (PBCV Advogados). Um QIJ_BRAND com
# marca que não existe aqui (ex.: o antigo "qi") cai nesta marca padrão.
brand: tech

brands:
  tech:
    name: "PBCV Tech"
    wordmark: ["PBCV", "", " Tech"]   # só sem logo (texto do cabeçalho); "PBCV" usa a cor de destaque
    tagline: "Seu terminal financeiro diário"
    # Logo "Quatro Formas" (Claude Design, PBCV Tech — Logo 2026). Pintado com
    # currentColor: a cor vem do cabeçalho (on_masthead), sem filtro no modo escuro.
    logo_svg: "assets/pbcv-tech-logo.svg"
    favicon_svg: "assets/pbcv-tech-favicon.svg"
    # Logo do e-mail (PNG 3x, off-white com fundo transparente), servido pelo
    # GitHub Pages em base_url + src. Clientes de e-mail não exibem SVG.
    email_logo: {src: "assets/pbcv-tech-logo-email.png", width: 212, height: 44}
    colors:
      primary: "#3322CC"     # --qi · azul da marca
      navy: "#0E1016"        # --qn · tinta (ticker, rodapé, títulos)
      accent: "#8C80FF"      # --qc · lavanda (marcadores, destaques sobre a tinta)
      alert: "#D14424"       # --qr · tijolo (radar ao vivo, fonte com erro)
      ticker_up: "#A59CFF"
      ticker_down: "#FF8A5C"
      masthead: "#3322CC"    # cabeçalho em bloco azul, como no logo
      on_masthead: "#F5F3ED" # logo, slogan e data sobre o azul
    section_palette: ["#3322CC", "#1E6B52", "#7A5C1F", "#B23A1E", "#0F5F7A", "#7A2E6E", "#5C5346"]
  pbcv:
    name: "PBCV Advogados"
    wordmark: ["PBCV", "", " ADVOGADOS"]
    tagline: "Boletim diário · Mercados, Negócios e Direito"
    logo_svg: "assets/pbcv-logo.svg"
    favicon_svg: "assets/pbcv-favicon.svg"
    colors:
      primary: "#394A7A"
      navy: "#1B2745"
      accent: "#A3B4E0"
      alert: "#FF2F80"
      ticker_up: "#7FC8FF"
      ticker_down: "#FF5C9A"
    section_palette: ["#1B2745", "#1F6F6B", "#394A7A", "#5B6FA8", "#C90055", "#7A5C1F", "#6B3FA0"]

# Seções da edição, na ordem de exibição. Os ids são usados pelo editor (IA ou
# heurístico) e nas âncoras da página. "keywords" alimenta a classificação
# heurística (sem acento, minúsculas; casamento por palavra/trecho). Palavras
# com até 3 letras casam só inteiras; as demais toleram até 3 letras a mais
# ("imobiliari" → "imobiliarios"). Um "=" no fim força a palavra inteira
# ("real=" não casa com "realiza"; "vale=" não casa com "valeria"). "meta"
# solto não entra (meta de inflação, meta fiscal): use "meta platforms".
sections:
  - id: brasil
    title: "Brasil · Economia"
    description: "Economia brasileira, política econômica, fiscal, juros, inflação, empresas brasileiras."
    keywords: [ipca, selic, copom, banco central, haddad, fiscal, arcabouco, pib, inflacao, desemprego, petrobras, vale=, itau, bradesco, nubank, bndes, tesouro, receita federal, imposto, tributar, reforma tributaria, orcamento, cambio, real=, reais=, balanca comercial, superavit, deficit, exportac, importac, secex, divida publica, boletim focus, relatorio focus, pesquisa focus]
  - id: mercados
    title: "Mercados & Finanças"
    description: "Bolsa, juros, câmbio, commodities, bancos, fundos, IPOs, M&A, cripto (Brasil e mundo)."
    keywords: [ibovespa, bolsa, b3, acoes, dolar, juros futuros, treasury, s&p, nasdaq, dow jones, fed, bitcoin, cripto, ipo, fusao, aquisicao, m&a, private equity, private credit, debenture, fundo, gestora, investidor, petroleo, brent, ouro, commodities, wall street]
  - id: juridico
    title: "Jurídico & Regulação"
    description: "Decisões do STF, STJ, TST e tribunais; legislação; regulação setorial; tributário; compliance."
    keywords: [stf, stj, tst, tse, tribunal, ministro, julgamento, decisao judicial, liminar, acordao, jurisprudencia, lei, projeto de lei, regulamenta, regulacao, cvm, anpd, cade, anatel, aneel, anvisa, tributario, processo, acao judicial, advogad, oab, justica]
  - id: politica
    title: "Política"
    description: "Política nacional: governo, Congresso, eleições, partidos."
    keywords: [lula, bolsonaro, congresso, camara, senado, eleicao, eleicoes, candidato, partido, pt, pl, planalto, ministerio, governo federal, deputado, senador, pesquisa eleitoral, turno]
  - id: mundo
    title: "Geopolítica & Mundo"
    description: "Relações internacionais, conflitos, EUA, China, Europa, América Latina."
    keywords: [trump, casa branca, china, xi jinping, russia, ucrania, putin, ira, israel, gaza, otan, uniao europeia, onu, tarifa, sancao, guerra, eua, argentina, milei, uruguai, venezuela, mexico, japao, india, ormuz, papa=, vaticano, pope=, vatican]
  - id: tecnologia
    title: "Tecnologia & Negócios"
    description: "Tecnologia, inteligência artificial, big techs, startups, negócios e indústria."
    keywords: [inteligencia artificial, ia, openai, anthropic, google, apple, microsoft, meta platforms, zuckerberg, facebook, instagram, nvidia, amazon, tesla, startup, chip, semicondutor, software, data center, dados pessoais, ciberseguranca, tecnologia, app, varejo, industria, spacex, starship, starlink, foguete, satelite, nasa, espacial, rocket, satellite]
  - id: imobiliario
    title: "Imobiliário"
    description: "Mercado imobiliário, fundos imobiliários (FIIs), construção, incorporação, crédito imobiliário, real estate global."
    keywords: [imobiliari, imovel, imoveis, fii, fiis, fundo imobiliario, ifix, incorporadora, construtora, construcao civil, lancamento, aluguel, locacao, shopping, galpao, lajes corporativas, credito imobiliario, financiamento imobiliario, minha casa minha vida, cri, real estate, property, mortgage, reit, secovi, incc]

edition:
  max_age_hours: 30            # ignora notícias mais velhas que isso
  max_candidates: 180          # candidatos enviados ao editor (após deduplicação)
  target_stories: 24           # matérias na edição (o editor pode variar ±4)
  secondary_count: 3           # chamadas ao lado da manchete
  highlights_count: 8          # lista numerada "Destaques"
  # Mínimos da coleta: abaixo deles a edição é abortada (job vermelho) e a
  # anterior continua no ar. Um dia normal traz ~1.000 artigos de 64 feeds;
  # o exemplo tests/fixtures/bundle.json (92 artigos, 59 feeds) também passa.
  min_articles: 80
  min_sources_ok: 16
  min_sources_ratio: 0.5       # fração mínima de feeds ok
  min_pt_sources_ok: 10        # veículos em português com artigos (evita edição só em inglês)
  enrich_limit: 40             # quantas matérias têm a página original consultada (imagem/descrição)
  exclude_url_patterns:        # descartados em todas as fontes (trecho da URL)
    - "/esporte/"
    - "/esportes/"
    - "/futebol/"
    - "/pop/"
    - "/celebridades/"
    - "/entretenimento/"
    - "/horoscopo/"
    - "/novelas/"
    - "/bbb/"
    - "/receitas/"
    - "/eu-e/"
    - "/sport/"
    - "/football/"
    - "/lifeandstyle/"
    - "/fashion/"
    - "/tv-and-radio/"
    - "/culture/"
    - "/style/"
    - "/sports/"
    - "/loterias/"
    - "resultado-do-concurso"
    - "/curiosidades/"
    - "/casual/"
    - "/patrocinado/"          # publieditorial
    - "/native/"
    - "/presented/"
    - "/buyside/"
    - "bbc.com/news/videos/"   # vídeos sem texto (os de análise da NeoFeed/g1 ficam)
    - "bbc.co.uk/news/videos/"
    - "aljazeera.com/video/"
  # Títulos de serviço (regex no título sem acento e em minúsculas). "ao vivo"
  # solto não entra: derrubaria coberturas como "Ibovespa ao vivo".
  exclude_title_patterns:
    - 'veja (?:o )?numero e nome'
    - 'quem sao os candidatos'
    - 'resultado d[oa] (?:concurso|mega ?sena|lotofacil|quina|lotomania|timemania|dupla ?sena)'
    - 'confira o resultado'
    - 'horoscopo'
    - '(?:como|onde) assistir'
    - 'gabarito'
    - 'transmite ao vivo'

llm:
  enabled: true
  # Editores por IA, na ordem de tentativa: Mistral (MISTRAL_API_KEY) e, se ele
  # faltar ou falhar, Claude (ANTHROPIC_API_KEY). Sem nenhum: edição automática.
  providers: [mistral, claude]
  # ── Mistral: lê TODAS as notícias do dia, agrupa por assunto, faz a pauta,
  # redige e compara a cobertura dos veículos (lados do debate + medidor).
  # Plano gratuito da Mistral (Experiment): todos os modelos, cota mensal folgada,
  # mas poucas requisições por minuto — por isso uma chamada de cada vez, com
  # intervalo mínimo entre elas (e novas tentativas se a API pedir para esperar).
  mistral_model: "mistral-large-latest"   # ou a variável QIJ_MISTRAL_MODEL
  mistral_max_tokens: 16000
  mistral_parallel: 1          # chamadas simultâneas nas etapas em lotes
  mistral_min_interval_seconds: 30
  topics_batch_chars: 100000   # tamanho de cada lote do agrupamento por assunto
  write_batch_size: 12         # matérias redigidas por chamada
  coverage: true               # cobertura comparada (lados do debate e conclusão)
  coverage_min_outlets: 2      # veículos distintos para comparar um assunto
  coverage_max_topics: 80      # assuntos além das matérias da edição
  coverage_batch_chars: 45000
  # ── Claude (reserva): pauta + redação em duas chamadas.
  model: "claude-opus-5-5"
  effort: "medium"
  # O raciocínio do modelo conta dentro de max_tokens (saída máxima: 128k); com
  # folga, a resposta não é cortada, o que descartaria a edição por IA inteira.
  max_tokens_select: 64000
  max_tokens_write: 64000
  # Prazo total da edição por IA, comum a todos os editores tentados (s). Com a
  # coleta (~8 min no pior caso), cabe no timeout-minutes (55) do daily.yml.
  deadline_seconds: 2100
  # Tempo máximo de espera por dados em cada requisição (Claude: sem dados do
  # stream, a API envia "ping" enquanto o modelo trabalha; Mistral: resposta).
  # Novas tentativas só começam se couberem em deadline_seconds.
  timeout_seconds: 300

# Cotações e indicadores do ticker, na ordem de exibição.
# provider: yahoo (símbolo do Yahoo Finance), coingecko (id da moeda),
#           bcb_sgs (série do SGS/Banco Central).
# transform (bcb_sgs): last = último valor; accum12 = acumulado de 12 meses a partir de variação mensal.
# format: brl | usd | pts | pct
market:
  - {id: usd, label: "Dólar", kind: fx, provider: yahoo, symbol: "USDBRL=X", format: brl, decimals: 2, fallback: {provider: bcb_sgs, series: 1, format: brl, decimals: 2}}
  - {id: eur, label: "Euro", kind: fx, provider: yahoo, symbol: "EURBRL=X", format: brl, decimals: 2, fallback: {provider: bcb_sgs, series: 21619, format: brl, decimals: 2}}
  - {id: cny, label: "Yuan", kind: fx, provider: yahoo, symbol: "CNYBRL=X", format: brl, decimals: 2}
  - {id: ibov, label: "Ibovespa", kind: index, provider: yahoo, symbol: "^BVSP", format: pts, decimals: 0}
  - {id: ifix, label: "IFIX", kind: index, provider: yahoo, symbol: "IFIX.SA", format: pts, decimals: 0}
  - {id: spx, label: "S&P 500", kind: index, provider: yahoo, symbol: "^GSPC", format: pts, decimals: 0}
  - {id: brent, label: "Brent", kind: commodity, provider: yahoo, symbol: "BZ=F", format: usd, decimals: 2}
  - {id: gold, label: "Ouro", kind: commodity, provider: yahoo, symbol: "GC=F", format: usd, decimals: 0}
  - {id: btc, label: "Bitcoin", kind: crypto, provider: yahoo, symbol: "BTC-USD", format: usd, decimals: 0, fallback: {provider: coingecko, coin: bitcoin, format: usd, decimals: 0}}
  - {id: selic, label: "Selic", kind: rate, provider: bcb_sgs, series: 432, transform: last, format: pct, decimals: 2}
  - {id: ipca12m, label: "IPCA 12m", kind: inflation, provider: bcb_sgs, series: 13522, transform: last, format: pct, decimals: 2}
  - {id: igpm12m, label: "IGP-M 12m", kind: inflation, provider: bcb_sgs, series: 189, transform: accum12, format: pct, decimals: 2}
  - {id: incc12m, label: "INCC 12m", kind: inflation, provider: bcb_sgs, series: 192, transform: accum12, format: pct, decimals: 2}

weather:
  - {name: "São Paulo", lat: -23.55, lon: -46.63, timezone: "America/Sao_Paulo"}
  - {name: "Montevidéu", lat: -34.90, lon: -56.16, timezone: "America/Montevideo"}

email:
  # Destinatários NÃO ficam aqui (o repositório é público): use o segredo
  # EMAIL_TO no GitHub Actions ou a rotina de e-mail do Claude.
  # Campos: {brand}, {date} (29/09/2026), {date_label} e {lead} (manchete, até 70 caracteres).
  subject_template: "{brand} · {date}: {lead}"
  max_stories: 14
