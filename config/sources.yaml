# Fontes de notícia (RSS/Atom). As URLs até a seção Internacional foram testadas
# a partir de um runner do GitHub Actions em 29/09/2026; as de tribunais, esporte
# e natureza entraram em 30/09/2026 sem teste. Para testar de novo:
#   python -m qijournal check-sources
#
# Campos:
#   id        identificador curto da fonte (repete-se entre feeds do mesmo veículo)
#   name      nome exibido nos créditos
#   url       endereço do feed
#   lang      pt | en | es
#   weight    peso editorial (0.5 a 1.5) usado no ranqueamento heurístico
#   topics    dicas de seção (ids de config/site.yaml) para o classificador;
#             feeds gerais (capas) ficam com [] e a dica sai do caminho da URL
#             (/internacional/ → mundo, /politica/ → politica, /economia/ → brasil...)
#   enabled   false para desligar sem apagar
#   exclude_url_patterns  trechos de URL descartados só nesta fonte

