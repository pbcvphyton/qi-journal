# Testes automáticos e geração de uma edição de exemplo (sem rede, sem IA).
name: CI

on:
  push:
    paths-ignore:
      - "index.html"
      - "edicoes/**"
      - "data/**"
  pull_request:
    paths-ignore:
      - "index.html"
      - "edicoes/**"
      - "data/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Testes
        run: pytest

      - name: Edição de exemplo (offline)
        run: |
          out="$RUNNER_TEMP/out"
          python -m qijournal render --bundle tests/fixtures/bundle.json --out "$out" --no-llm
          date=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["date"])' "$out/edicoes/latest.json")
          for file in index.html "edicoes/$date.html" edicoes/index.html edicoes/latest.json \
                      edicoes/email.html edicoes/email.txt "data/$date.json"; do
            test -s "$out/$file" || { echo "::error::$file não foi gerado"; exit 1; }
          done
          ls -la "$out" "$out/edicoes" "$out/data"
