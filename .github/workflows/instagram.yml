# Instagram da Triangula: depois de cada edição, gera as imagens e legendas do
# dia (python -m qijournal instagram gerar) e publica pela API oficial do
# Instagram o que já venceu na fila (python -m qijournal instagram publicar).
#
# Imagens e fila ficam na branch "instagram", reescrita a cada execução com só
# os últimos dias (não incha o histórico da main). A API do Instagram baixa as
# imagens de raw.githubusercontent.com. Sem os segredos IG_USER_ID e
# IG_ACCESS_TOKEN, as imagens são geradas mas nada é publicado.
name: Instagram

on:
  workflow_run:
    # Logo depois de cada execução da edição diária (a de hora em hora também:
    # termina em segundos quando não há nada novo).
    workflows: ["Edição diária"]
    types: [completed]
  schedule:
    # De hora em hora, para as publicações da tarde e da noite. O GitHub atrasa
    # os agendamentos deste repositório; a fila tolera (cada publicação tem um
    # prazo depois do qual não sai mais).
    - cron: "37 * * * *"
  repository_dispatch:
    types: [instagram]
  workflow_dispatch:
    inputs:
      regerar:
        description: "Refazer as imagens e legendas de hoje (o que já saiu não muda)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  # Uma execução por vez: a fila na branch instagram tem um único escritor.
  group: instagram
  cancel-in-progress: false

jobs:
  instagram:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Logo depois da edição, o publicador espera até 75 min pelo horário-alvo
    # das publicações da manhã (minutos do Actions são grátis em repositório
    # público), em vez de depender do agendamento, que atrasa horas.
    timeout-minutes: 120
    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      MEDIA_DIR: instagram-midia
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Baixar a fila e as imagens (branch instagram)
        run: |
          mkdir -p "$MEDIA_DIR"
          if git ls-remote --exit-code --heads origin instagram >/dev/null; then
            # A branch existe: sem ela a fila zeraria e publicações poderiam sair em dobro.
            git fetch --quiet --depth 1 origin instagram
            git archive FETCH_HEAD | tar -x -C "$MEDIA_DIR"
          else
            echo "Branch instagram ainda não existe; começando uma fila nova."
          fi
          ls -la "$MEDIA_DIR"

      - name: Verificar o que fazer
        id: plan
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INPUT_REGERAR: ${{ inputs.regerar }}
        run: |
          today=$(date +%F)
          edition=$(python3 -c 'import json; print(json.load(open("edicoes/latest.json")).get("date", ""))' 2>/dev/null || true)
          queued=$(python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print(any(p.get("date") == sys.argv[2] for p in d.get("posts", [])))' "$MEDIA_DIR/fila.json" "$today" 2>/dev/null || echo False)
          if [ "$edition" != "$today" ]; then
            echo "Edição de hoje ($today) ainda não saiu (última: ${edition:-nenhuma}); nada a gerar."
            echo "generate=false" >> "$GITHUB_OUTPUT"
          elif [ "$queued" = "True" ] && [ "$INPUT_REGERAR" != "true" ]; then
            echo "Publicações de $today já estão na fila."
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "Gerando as publicações de $today."
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$IG_USER_ID" ] && [ -n "$IG_ACCESS_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Instagram não configurado (segredos IG_USER_ID e IG_ACCESS_TOKEN): as imagens são geradas, mas nada é publicado."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Python
        if: steps.plan.outputs.generate == 'true' || steps.plan.outputs.publish == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        if: steps.plan.outputs.generate == 'true' || steps.plan.outputs.publish == 'true'
        run: pip install -r requirements.txt

      - name: Instalar o Chromium (Playwright)
        if: steps.plan.outputs.generate == 'true'
        run: |
          pip install -r requirements-instagram.txt
          python -m playwright install --with-deps chromium

      - name: Gerar as imagens e legendas do dia
        if: steps.plan.outputs.generate == 'true'
        run: python -m qijournal instagram gerar --dir . --media-dir "$MEDIA_DIR"

      - name: Guardar as imagens (branch instagram)
        if: steps.plan.outputs.generate == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/instagram-branch.sh "🖼️ Instagram: publicações de $(date +%d/%m/%Y)"

      - name: Conferir e renovar o token do Instagram
        id: token
        if: steps.plan.outputs.publish == 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O token da "Instagram API with Instagram Login" vale 60 dias: é
          # renovado toda semana e o novo vai já para o segredo (passo seguinte).
          python -m qijournal instagram token --media-dir "$MEDIA_DIR" --sync \
            --token-out "$RUNNER_TEMP/ig-token" --alert-out "$RUNNER_TEMP/ig-alerta.txt"

      - name: Guardar o token renovado
        # Com o segredo GH_SECRETS_TOKEN (token fine-grained com "Secrets: write"
        # só neste repositório), o token novo substitui o IG_ACCESS_TOKEN.
        if: always() && hashFiles(format('{0}/ig-token', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Token do Instagram renovado, mas o segredo GH_SECRETS_TOKEN não existe para guardá-lo."
          else
            gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig-token"
            echo "Segredo IG_ACCESS_TOKEN atualizado."
          fi

      - name: Publicar no Instagram
        id: publish
        if: steps.plan.outputs.publish == 'true' && steps.token.outcome == 'success'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Se o token acabou de ser renovado, o segredo só muda para o próximo
          # job: este usa o novo, lido do arquivo temporário (--token-file).
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          IG_PAUSE: ${{ vars.IG_PAUSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          # --sync: a fila vai para a branch instagram a cada passo (container
          # criado, publicado), para nada sair em dobro se a execução morrer.
          args=(--media-dir "$MEDIA_DIR" --sync --token-file "$RUNNER_TEMP/ig-token" --alert-out "$RUNNER_TEMP/ig-alerta.txt")
          if [ "$EVENT" = "workflow_run" ] || [ "$EVENT" = "repository_dispatch" ]; then args+=(--wait-max 75); fi
          python -m qijournal instagram publicar "${args[@]}"

      - name: Guardar a fila (branch instagram)
        if: always() && steps.plan.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/instagram-branch.sh "📸 Instagram: fila em $(date '+%d/%m/%Y %H:%M')"

      - name: Apagar o token temporário
        if: always()
        run: rm -f "$RUNNER_TEMP/ig-token"

      - name: Avisar o dono (issue)
        # O GitHub manda e-mail ao dono do repositório a cada issue e comentário.
        if: always() && hashFiles(format('{0}/ig-alerta.txt', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Instagram: ação necessária"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="$(cat "$RUNNER_TEMP/ig-alerta.txt")

          Passo a passo: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/instagram.md
          Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER" \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Fechar o aviso resolvido
        if: steps.publish.outcome == 'success' && hashFiles(format('{0}/ig-alerta.txt', runner.temp)) == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Instagram: ação necessária"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Resolvido: o Instagram voltou a publicar normalmente."
          fi

      - name: Resultado
        if: steps.token.outcome == 'failure' || steps.publish.outcome == 'failure'
        run: |
          echo "::error::O Instagram falhou; veja os passos \"Conferir e renovar o token\" e \"Publicar no Instagram\"."
          exit 1
